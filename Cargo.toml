[package]
name = "jailbreakreplay"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Pre-registered jailbreak reproducibility: rerun published attacks under controlled conditions and report whether the claimed attack-success rate reproduces."
repository = "https://github.com/Intermountainh8ter/jailbreakreplay"
keywords = ["llm", "safety", "jailbreak", "reproducibility", "adversarial"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
rand_pcg = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time"] }
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }

[[bin]]
name = "jailbreakreplay"
path = "src/main.rs"

[lib]
name = "jailbreakreplay"
path = "src/lib.rs"
